<?xml version="1.0" encoding="UTF-8"?>
<!--
  Shared icon sprite.

  Why this exists: three shapes accounted for 5.1 MB of the 8.9 MB of inline SVG
  in the built site. A five star rating writes the same 445 byte path five times
  per review, and a page with fifty reviews wrote it 250 times. Referencing a
  symbol costs about 70 bytes per use and the sprite is fetched and cached once
  for the whole site.

  Add a symbol here only when the same shape is repeated across pages. One off
  illustrations stay inline, where they cost nothing extra and avoid a request.

  Symbols keep fill="currentColor" or stroke="currentColor" so colour still
  comes from the CSS class on the referencing <svg>, exactly as before.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <!-- Solid five point star, 20x20 grid. Used by every rating block. -->
  <symbol id="star" viewBox="0 0 20 20" fill="currentColor">
    <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
  </symbol>

  <!-- Chevron down, 24x24. Accordion and dropdown disclosure. -->
  <symbol id="chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 9l-7 7-7-7"/>
  </symbol>

  <!-- Chevron right, 24x24. List affordance. -->
  <symbol id="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 5l7 7-7 7"/>
  </symbol>

  <!-- Arrow right, 24x24. Call to action affordance. -->
  <symbol id="arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 7l5 5m0 0l-5 5m5-5H6"/>
  </symbol>

</svg>
