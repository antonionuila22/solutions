[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 / @astrojs/netlify 8 / react 6 / mdx 7 require Node >=22.12.0.
  NODE_VERSION = "22"
  # These server-side secrets are intentionally inlined by Vite into the SSR
  # bundle. They are NOT exposed to the client — only used in serverless functions.
  SECRETS_SCAN_OMIT_KEYS = "TURSO_AUTH_TOKEN,TURSO_DATABASE_URL,RESEND_API_KEY,RESEND_FROM_EMAIL,CONTACT_RECIPIENT_EMAIL"

# ===========================================
# ASTRO BUNDLED ASSETS (with content hashes)
# Maximum caching - these files never change
# ===========================================

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    CDN-Cache-Control = "public, max-age=31536000, immutable"

# ===========================================
# STATIC ASSETS - Fonts (1 year, immutable)
# ===========================================

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    CDN-Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    CDN-Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ===========================================
# IMAGES - 30-day caching (filenames aren't content-hashed; rename on visual change)
# ===========================================

# Icons directory (SVGs, favicons)
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"
    CDN-Cache-Control = "public, max-age=2592000"

# Photos directory
[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"
    CDN-Cache-Control = "public, max-age=2592000"

# Image formats
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.avif"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.gif"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

# ===========================================
# DOCUMENTS & DATA
# ===========================================

[[headers]]
  for = "/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=86400"

# ===========================================
# SEO FILES
# ===========================================

[[headers]]
  for = "/sitemap*.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=86400"

# ===========================================
# HTML PAGES - Short cache with background revalidation
# Allows fast loads while keeping content fresh
# ===========================================

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=60, stale-while-revalidate=60"
    CDN-Cache-Control = "public, max-age=60, stale-while-revalidate=60"
    # Preload critical resources: fonts first, then CSS
    Link = '''
      </fonts/Poppins-Regular.woff2>; rel=preload; as=font; type=font/woff2; crossorigin,
      </fonts/Poppins-SemiBold.woff2>; rel=preload; as=font; type=font/woff2; crossorigin
    '''

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=60, stale-while-revalidate=60"
    CDN-Cache-Control = "public, max-age=60, stale-while-revalidate=60"

# High-traffic pages
[[headers]]
  for = "/contact"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=60, stale-while-revalidate=60"
    CDN-Cache-Control = "public, max-age=60"

[[headers]]
  for = "/services/*"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=60, stale-while-revalidate=60"
    CDN-Cache-Control = "public, max-age=60"

[[headers]]
  for = "/blog/*"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=60, stale-while-revalidate=60"
    CDN-Cache-Control = "public, max-age=60"

# ===========================================
# SECURITY & PERFORMANCE HEADERS - All pages
# ===========================================

[[headers]]
  for = "/*"
  [headers.values]
    # Security
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net https://analytics.ahrefs.com https://assets.calendly.com; style-src 'self' 'unsafe-inline' https://assets.calendly.com; img-src 'self' data: https://www.googletagmanager.com https://www.google-analytics.com https://www.facebook.com https://analytics.ahrefs.com; connect-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://analytics.ahrefs.com https://connect.facebook.net https://www.facebook.com; frame-src https://calendly.com https://www.facebook.com https://www.googletagmanager.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Permitted-Cross-Domain-Policies = "none"

    # Performance hints
    X-DNS-Prefetch-Control = "on"

# ===========================================
# PRECONNECT for external resources
# ===========================================
# The two Google Fonts origins were removed on 2026-10-03. This site has never
# loaded a Google font: Poppins is self hosted and preloaded from /fonts/, and
# neither origin appears anywhere in the source. Every page was paying a DNS
# lookup and a TLS handshake to two hosts it never contacts, which Lighthouse
# flags on a throttled connection and which crowds out the hints that matter.
#
# Keep this list under four entries, and only for origins the page really
# requests. Tag Manager stays because the page does load it.

[[headers]]
  for = "/"
  [headers.values]
    Link = '''
      <https://www.googletagmanager.com>; rel=preconnect
    '''

# ===========================================
# API & DYNAMIC ROUTES - No caching
# ===========================================

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    CDN-Cache-Control = "no-store"

# ===========================================
# NETLIFY FUNCTIONS
# ===========================================

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ===========================================
# REDIRECTS (if needed)
# ===========================================

# Canonical host is https://www.codebrand.us. Netlify's automatic primary-domain
# redirect sends http://codebrand.us through two hops (https://codebrand.us first).
# These explicit rules collapse every apex request into a single 301 to www.
# /llm.txt was a second, unlinked company profile that drifted out of date:
# "Last updated: February 2026", a stack described as Astro 5 while the site
# runs Astro 7, and the old postal code until yesterday. Two documents of 42 and
# 77 KB answering the same questions differently is worse for an AI assistant
# than one, so it folds into /llms.txt, which is the file robots.txt and the
# layout actually point at. Declared here rather than in astro.config.mjs
# because that config maps routes, and this is a static file.
[[redirects]]
  from = "/llm.txt"
  to = "/llms.txt"
  status = 301

[[redirects]]
  from = "http://codebrand.us/*"
  to = "https://www.codebrand.us/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://codebrand.us/*"
  to = "https://www.codebrand.us/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.codebrand.us/*"
  to = "https://www.codebrand.us/:splat"
  status = 301
  force = true

# Conventional /sitemap.xml → serve the Astro-generated sitemap index as a 200
# rewrite, so crawlers/tools that probe the default filename find it (robots.txt
# already declares /sitemap-index.xml and /sitemap-0.xml too).
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 200

[[redirects]]
  from = "/desarrollo-web-honduras"
  to = "/hn/desarrollo-web-honduras"
  status = 301
  force = true

[[redirects]]
  from = "/work"
  to = "/projects"
  status = 301
  force = true

# --- SEO fixes: 404s & legacy slugs → final canonical (www handled by Netlify primary domain) ---

# Spanish e-commerce landing lives under the /hn/ locale
[[redirects]]
  from = "/tienda-online-honduras"
  to = "/hn/tienda-online-honduras"
  status = 301
  force = true

# Removed service page → closest live service
[[redirects]]
  from = "/copywriting"
  to = "/digital-marketing"
  status = 301
  force = true

[[redirects]]
  from = "/copywriting/"
  to = "/digital-marketing"
  status = 301
  force = true

# Renamed location slugs (old indexed URLs → current files)
[[redirects]]
  from = "/locations/liberia-gu"
  to = "/locations/liberia-cr"
  status = 301
  force = true

[[redirects]]
  from = "/locations/la-chorrera-po"
  to = "/locations/la-chorrera"
  status = 301
  force = true
