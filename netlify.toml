[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 / @astrojs/netlify 8 / react 6 / mdx 7 require Node >=22.12.0.
  NODE_VERSION = "22"
  # These server-side secrets are intentionally inlined by Vite into the SSR
  # bundle. They are NOT exposed to the client — only used in serverless functions.
  SECRETS_SCAN_OMIT_KEYS = "TURSO_AUTH_TOKEN,TURSO_DATABASE_URL,RESEND_API_KEY,RESEND_FROM_EMAIL,CONTACT_RECIPIENT_EMAIL"

# ===========================================
# ASTRO BUNDLED ASSETS (with content hashes)
# Maximum caching - these files never change
# ===========================================

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    CDN-Cache-Control = "public, max-age=31536000, immutable"

# ===========================================
# STATIC ASSETS - Fonts (1 year, immutable)
# ===========================================

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    CDN-Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    CDN-Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ===========================================
# IMAGES - 30-day caching (filenames aren't content-hashed; rename on visual change)
# ===========================================

# Icons directory (SVGs, favicons)
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"
    CDN-Cache-Control = "public, max-age=2592000"

# Photos directory
[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"
    CDN-Cache-Control = "public, max-age=2592000"

# Image formats
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.avif"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.gif"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

# ===========================================
# DOCUMENTS & DATA
# ===========================================

[[headers]]
  for = "/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=86400"

# ===========================================
# SEO FILES
# ===========================================

[[headers]]
  for = "/sitemap*.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=86400"

# ===========================================
# HTML PAGES - Short cache with background revalidation
# Allows fast loads while keeping content fresh
# ===========================================

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=60, stale-while-revalidate=60"
    CDN-Cache-Control = "public, max-age=60, stale-while-revalidate=60"
    # Preload critical resources: fonts first, then CSS
    Link = '''
      </fonts/Poppins-Regular.woff2>; rel=preload; as=font; type=font/woff2; crossorigin,
      </fonts/Poppins-SemiBold.woff2>; rel=preload; as=font; type=font/woff2; crossorigin
    '''

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=60, stale-while-revalidate=60"
    CDN-Cache-Control = "public, max-age=60, stale-while-revalidate=60"

# High-traffic pages
[[headers]]
  for = "/contact"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=60, stale-while-revalidate=60"
    CDN-Cache-Control = "public, max-age=60"

[[headers]]
  for = "/services/*"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=60, stale-while-revalidate=60"
    CDN-Cache-Control = "public, max-age=60"

[[headers]]
  for = "/blog/*"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=60, stale-while-revalidate=60"
    CDN-Cache-Control = "public, max-age=60"

# ===========================================
# SECURITY & PERFORMANCE HEADERS - All pages
# ===========================================

[[headers]]
  for = "/*"
  [headers.values]
    # Security
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net https://analytics.ahrefs.com https://assets.calendly.com; style-src 'self' 'unsafe-inline' https://assets.calendly.com; img-src 'self' data: https://www.googletagmanager.com https://www.google-analytics.com https://www.facebook.com https://analytics.ahrefs.com; connect-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://analytics.ahrefs.com https://connect.facebook.net https://www.facebook.com; frame-src https://calendly.com https://www.facebook.com https://www.googletagmanager.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Permitted-Cross-Domain-Policies = "none"

    # Performance hints
    X-DNS-Prefetch-Control = "on"

# ===========================================
# PRECONNECT for external resources
# ===========================================
# The two Google Fonts origins were removed on 2026-10-03. This site has never
# loaded a Google font: Poppins is self hosted and preloaded from /fonts/, and
# neither origin appears anywhere in the source. Every page was paying a DNS
# lookup and a TLS handshake to two hosts it never contacts, which Lighthouse
# flags on a throttled connection and which crowds out the hints that matter.
#
# Keep this list under four entries, and only for origins the page really
# requests. Tag Manager stays because the page does load it.

[[headers]]
  for = "/"
  [headers.values]
    Link = '''
      <https://www.googletagmanager.com>; rel=preconnect
    '''

# ===========================================
# API & DYNAMIC ROUTES - No caching
# ===========================================

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    CDN-Cache-Control = "no-store"

# ===========================================
# NETLIFY FUNCTIONS
# ===========================================

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ===========================================
# REDIRECTS (if needed)
# ===========================================

# Canonical host is https://www.codebrand.us, and the whole site agrees: all
# 411 sitemap URLs, every rel=canonical and both robots.txt Sitemap lines point
# at www. Nothing points at the apex.
#
# One correction to an earlier version of this comment, which overstated the
# problem. These rules do not collapse http://codebrand.us into a single hop:
# Netlify applies its own HTTPS upgrade at the edge before any rule declared
# here, so the request reaches https://codebrand.us first and only then matches
# the apex-to-www rule below, and force = true does not reorder that. Measured
# 2026-10-04 at 1.29 s against 0.81 s for www.
#
# But that cost reaches almost nobody. It is paid only by someone typing the
# bare domain by hand. Search results, links and ads all arrive at www already.
# A Lighthouse run pointed at the apex reports it as the largest item in the
# report, which is a measurement artifact of testing a non-canonical URL rather
# than a cost real visitors pay. Run Lighthouse against
# https://www.codebrand.us/ and the item disappears without changing anything.
#
# If it is ever worth closing, the fix is not a redirect rule but HSTS
# preloading, since a browser that already knows the domain is HTTPS-only never
# makes the http request. The header is correct on both hosts and
# hstspreload.org reports the domain eligible with zero errors. Note that the
# submission is always for the registrable domain, codebrand.us, never for
# www: includeSubDomains is what covers www. It is the owner's call and not an
# urgent one: preloading is hard to reverse, removal takes months, and
# includeSubDomains commits every future subdomain to HTTPS.
#
# The rules below are correct and needed. They are what turns
# https://codebrand.us into www in one hop.
# /llm.txt was a second, unlinked company profile that drifted out of date:
# "Last updated: February 2026", a stack described as Astro 5 while the site
# runs Astro 7, and the old postal code until yesterday. Two documents of 42 and
# 77 KB answering the same questions differently is worse for an AI assistant
# than one, so it folds into /llms.txt, which is the file robots.txt and the
# layout actually point at. Declared here rather than in astro.config.mjs
# because that config maps routes, and this is a static file.
[[redirects]]
  from = "/llm.txt"
  to = "/llms.txt"
  status = 301

# Links copied out of markdown on other sites keep the closing parenthesis,
# "[post](https://codebrand.us/blog/slug/))", and Search Console reported
# /blog/vercel-vs-netlify-vs-cloudflare-2026/)) as a 404. A placeholder only
# matches a whole path segment, so this catches the stray parentheses after a
# trailing slash, which is how every URL on the site ends, for pages one and
# two levels deep. A URL without the slash ("slug))") cannot be matched here
# and needs its own rule.
[[redirects]]
  from = "/:section/:page/))"
  to = "/:section/:page/"
  status = 301

[[redirects]]
  from = "/:section/:page/)"
  to = "/:section/:page/"
  status = 301

[[redirects]]
  from = "/:page/))"
  to = "/:page/"
  status = 301

[[redirects]]
  from = "/:page/)"
  to = "/:page/"
  status = 301

# The 2025 /servicios/ pages linked to "contact" without a leading slash, so
# every one of them sent crawlers to /servicios/<page>/contact. They kept that
# link after moving to /services/.
[[redirects]]
  from = "/servicios/contact"
  to = "/contact/"
  status = 301

[[redirects]]
  from = "/servicios/:page/contact"
  to = "/contact/"
  status = 301

[[redirects]]
  from = "/services/contact"
  to = "/contact/"
  status = 301

[[redirects]]
  from = "/services/:page/contact"
  to = "/contact/"
  status = 301

# Historic URLs with a file extension or a trailing dot, kept here rather than
# in legacy-redirects.ts because they are not route shaped: raw source paths
# that old posts linked to by mistake, and two links that swallowed the full
# stop after them.
[[redirects]]
  from = "/llms-full.txt"
  to = "/llms.txt"
  status = 301

[[redirects]]
  from = "/contact."
  to = "/contact/"
  status = 301

[[redirects]]
  from = "/nearshore-cost-calculator."
  to = "/quoter/"
  status = 301

[[redirects]]
  from = "/countryareas/index.astro"
  to = "/countryareas/"
  status = 301

[[redirects]]
  from = "/products/index.astro"
  to = "/products/"
  status = 301

[[redirects]]
  from = "/src/content/blog/5-design-mistakes-that-make-your-website-look-cheap.md"
  to = "/blog/5-design-mistakes-that-make-your-website-look-cheap/"
  status = 301

[[redirects]]
  from = "/src/content/blog/how-much-should-a-good-website-cost-in-2025.md"
  to = "/blog/how-much-should-a-good-website-cost-in-2025/"
  status = 301

[[redirects]]
  from = "/src/content/blog/how-to-make-ads-that-dont-sound-like-ads.md"
  to = "/blog/how-to-make-ads-that-dont-sound-like-ads/"
  status = 301

[[redirects]]
  from = "/src/content/blog/landing-pages-that-convert-vs-those-that-dont.md"
  to = "/blog/landing-pages-that-convert-vs-those-that-dont/"
  status = 301

[[redirects]]
  from = "/src/content/blog/web-development-cost-comparison-usa-vs-honduras-2024.md"
  to = "/blog/web-development-cost-comparison-usa-vs-honduras-2024/"
  status = 301

[[redirects]]
  from = "http://codebrand.us/*"
  to = "https://www.codebrand.us/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://codebrand.us/*"
  to = "https://www.codebrand.us/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.codebrand.us/*"
  to = "https://www.codebrand.us/:splat"
  status = 301
  force = true

# Conventional /sitemap.xml → serve the Astro-generated sitemap index as a 200
# rewrite, so crawlers/tools that probe the default filename find it (robots.txt
# already declares /sitemap-index.xml and /sitemap-0.xml too).
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 200

[[redirects]]
  from = "/desarrollo-web-honduras"
  to = "/hn/desarrollo-web-honduras"
  status = 301
  force = true

[[redirects]]
  from = "/work"
  to = "/projects"
  status = 301
  force = true

# --- SEO fixes: 404s & legacy slugs → final canonical (www handled by Netlify primary domain) ---

# Spanish e-commerce landing lives under the /hn/ locale
[[redirects]]
  from = "/tienda-online-honduras"
  to = "/hn/tienda-online-honduras"
  status = 301
  force = true

# Removed service page → closest live service
[[redirects]]
  from = "/copywriting"
  to = "/digital-marketing"
  status = 301
  force = true

[[redirects]]
  from = "/copywriting/"
  to = "/digital-marketing"
  status = 301
  force = true

# Renamed location slugs (old indexed URLs → current files)
[[redirects]]
  from = "/locations/liberia-gu"
  to = "/locations/liberia-cr"
  status = 301
  force = true

[[redirects]]
  from = "/locations/la-chorrera-po"
  to = "/locations/la-chorrera"
  status = 301
  force = true
